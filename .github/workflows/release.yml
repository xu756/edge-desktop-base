name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0-beta.17

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            echo "Expected: v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
            arch: amd64
            task: windows:package
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
            task: linux:create:deb
          - runner: macos-15
            platform: darwin
            arch: arm64
            task: darwin:package:pkg
          # - runner: macos-15-intel
          #   platform: darwin
          #   arch: amd64
          #   task: darwin:package:pkg

    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Generate version metadata from tag
        run: go run ./cmd/buildmeta -release

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build application
        run: wails3 task ${{ matrix.task }} ARCH=${{ matrix.arch }} INSTALL_SCOPE=user

      - name: Prepare Windows updater asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "bin/$env:APP_NAME.exe" "release/$env:ASSET_PREFIX-windows-${{ matrix.arch }}.exe"

      - name: Prepare Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "bin/$env:APP_NAME-${{ matrix.arch }}-installer.exe" "release/$env:ASSET_PREFIX-windows-${{ matrix.arch }}-installer.exe"

      - name: Prepare Linux updater asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "bin/${APP_NAME}" "release/${ASSET_PREFIX}-linux-${{ matrix.arch }}"
          chmod +x "release/${ASSET_PREFIX}-linux-${{ matrix.arch }}"

      - name: Prepare Linux DEB installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(bin/*.deb)
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" "release/${ASSET_PREFIX}-linux-${{ matrix.arch }}.deb"

      - name: Prepare macOS updater asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "bin/${APP_NAME}.app" \
            "release/${ASSET_PREFIX}-darwin-${{ matrix.arch }}.zip"

      - name: Prepare macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cp "bin/${APP_NAME}-${{ matrix.arch }}.pkg" "release/${ASSET_PREFIX}-darwin-${{ matrix.arch }}.pkg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_PREFIX }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Publish CNB distribution
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: python3 ./scripts/publish-cnb-release.py
