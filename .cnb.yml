'v*':
  tag_push:
    - name: Release Linux amd64
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: golang:1.25.14-bookworm
        volumes:
          - /go/pkg/mod
          - /root/.cache/go-build
          - /root/.bun/install/cache
      stages:
        - name: Validate release tag
          script: |
            set -eu
            tag="${CNB_BRANCH}"
            if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "Invalid release tag: $tag"
              echo "Expected: v1.2.3 or v1.2.3-beta.1"
              exit 1
            fi

        - name: Install build toolchain
          script: |
            set -eu
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates \
              curl \
              git \
              build-essential \
              pkg-config \
              unzip \
              libgtk-4-dev \
              libwebkitgtk-6.0-dev
            rm -rf /var/lib/apt/lists/*

            curl -fsSL https://bun.sh/install -o /tmp/install-bun.sh
            bash /tmp/install-bun.sh
            rm -f /tmp/install-bun.sh
            ln -sf /root/.bun/bin/bun /usr/local/bin/bun
            go env -w GO111MODULE=on
            go env -w  GOPROXY=https://goproxy.cn,direct
            go install github.com/wailsapp/wails/v3/cmd/wails3@latest
            ln -sf "$(go env GOPATH)/bin/wails3" /usr/local/bin/wails3

            go version
            bun --version
            wails3 version

        - name: Build Linux release assets
          script: |
            set -eu

            export VERSION="${CNB_BRANCH#v}"
            export COMMIT="${CNB_COMMIT}"

            go run ./cmd/buildmeta -release
            wails3 task linux:create:deb ARCH=amd64

            APP_NAME="$(sed -n 's/^[[:space:]]*"binaryName":[[:space:]]*"\([^"]*\)".*/\1/p' project/app.json | head -n1)"
            if [ -z "$APP_NAME" ]; then
              echo "Unable to resolve binaryName from project/app.json"
              exit 1
            fi

            ASSET_PREFIX="${APP_NAME}"
            mkdir -p release

            cp "bin/${APP_NAME}" "release/${ASSET_PREFIX}-linux-amd64"
            chmod +x "release/${ASSET_PREFIX}-linux-amd64"

            package_count="$(find bin -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')"
            if [ "$package_count" -ne 1 ]; then
              echo "Expected exactly one DEB package, found ${package_count}"
              exit 1
            fi
            package="$(find bin -maxdepth 1 -type f -name '*.deb' -print -quit)"
            cp "$package" "release/${ASSET_PREFIX}-linux-amd64.deb"

            (
              cd release
              sha256sum -- "${ASSET_PREFIX}-linux-amd64" "${ASSET_PREFIX}-linux-amd64.deb" > SHA256SUMS
              cat SHA256SUMS
            )

        - name: Create stable CNB Release
          if: |
            ! printf '%s' "$CNB_BRANCH" | grep -q -- '-'
          type: git:release
          options:
            title: $CNB_BRANCH
            latest: true

        - name: Create prerelease CNB Release
          if: |
            printf '%s' "$CNB_BRANCH" | grep -q -- '-'
          type: git:release
          options:
            title: $CNB_BRANCH
            preRelease: true
            latest: false

        - name: Upload CNB Release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - release/*
