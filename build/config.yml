# Wails v3 build configuration.
# Run `wails3 task common:update:build-assets` after changing application metadata.
version: '3'

info:
  companyName: "xu756"
  productName: "Edge Desktop Base"
  productIdentifier: "io.github.xu756.edge-desktop-base"
  description: "Reusable Wails v3 desktop application foundation"
  copyright: "(c) 2026, xu756"
  comments: "Wails v3 + Bun + shadcn desktop base"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:

other:
  - name: Desktop Base
